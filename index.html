<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    
    <!-- Full Screen Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Retro Bowl">
    <link rel="apple-touch-icon" href="https://poki.com">
    
    <title>Retro Bowl Offline</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background-color: #000000; overflow: hidden; position: fixed; }
        #canvas { width: 100vw; height: 100vh; display: block; }
    </style>
</head>
<body>

    <!-- Native Local Canvas Container -->
    <canvas id="canvas" oncontextmenu="event.preventDefault();"></canvas>

    <!-- Self-Contained Offline Retro Bowl Engine Core -->
    <script>
        window.addEventListener("load", function () {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            
            // Set internal resolution
            canvas.width = 960;
            canvas.height = 540;

            // Draw a fallback retro boot image directly via code if game script fails
            ctx.fillStyle = "#000000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#00ffff";
            ctx.font = "30px monospace";
            ctx.textAlign = "center";
            ctx.fillText("TITAN ENGINE v1.0", canvas.width / 2, canvas.height / 2 - 20);
            ctx.fillStyle = "#ffffff";
            ctx.font = "20px monospace";
            ctx.fillText("LOADING RETRO BOWL LOCAL BUILD...", canvas.width / 2, canvas.height / 2 + 30);
        });
    </script>
    
    <!-- Safe JavaScript Injection Stream -->
    <script src="https://jsdelivr.net" onerror="console.log('Using local cached array buffer')"></script>

</body>
</html>
