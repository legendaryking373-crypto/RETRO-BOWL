<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    
    <!-- iOS Full Screen Web App Activation Flags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Retro Bowl">
    
    <!-- Custom Home Screen App Icon Configuration -->
    <link rel="apple-touch-icon" href="https://poki.com">
    
    <title>Retro Bowl</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            position: fixed;
        }
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            outline: none;
            display: block;
        }
    </style>
</head>
<body>

    <!-- Embedded Clean Retro Bowl Production Stream -->
    <iframe 
        src="https://konggames.com" 
        scrolling="no" 
        allowfullscreen="true"
        webkitallowfullscreen="true"
        mozallowfullscreen="true">
    </iframe>

</body>
</html>
